tesseract:
  fallback_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  psm_primary: 6
  psm_secondary: 4

photo_validation:
  allowed_formats:
    - "JPEG"
    - "PNG"
  min_size_kb: 10
  max_size_kb: 5120
  min_width: 300
  min_height: 400
  max_width: 4000
  max_height: 5000
  target_aspect_ratio: 0.75  # 3:4 (w/h)
  aspect_ratio_tolerance: 0.15
  min_brightness: 50.0
  max_brightness: 205.0
  min_contrast: 28.0
  min_sharpness_laplacian: 60.0
  max_overexposed_pct: 12.0
  max_underexposed_pct: 12.0
  face_detection:
    min_face_pct: 0.06
    max_face_pct: 0.75
    center_tolerance_x: 0.35
    center_tolerance_y: 0.35

formats:
  tn_board:
    id: "tn_board"
